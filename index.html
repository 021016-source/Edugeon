<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>던전 오브 앎</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 인증 섹션 (로그인 / 회원가입) -->
    <section id="auth-section" class="auth-container">
      <div class="auth-box">
        <h2>던전 오브 앎</h2>
        <p class="auth-subtitle">지식과 모험이 기다리는 곳</p>

        <!-- 에러 및 안내 메시지 출력 영역 -->
        <div id="auth-error" class="auth-error-msg" style="display: none;"></div>

        <form id="login-form">
          <div class="input-group">
            <label for="login-email">이메일</label>
            <input type="email" id="login-email" placeholder="example@email.com" required />
          </div>

          <div class="input-group">
            <label for="login-pw">비밀번호</label>
            <input type="password" id="login-pw" placeholder="비밀번호 입력" required />
          </div>

          <!-- 회원가입 모드일 때만 활성화되는 닉네임 입력란 -->
          <div class="input-group" id="nickname-group" style="display: none;">
            <label for="login-nickname">모험가 이름 (닉네임)</label>
            <input type="text" id="login-nickname" placeholder="용감한 모험가" />
          </div>

          <button type="submit" id="btn-submit" class="btn-primary">입장하기</button>
        </form>

        <div class="auth-toggle">
          <button type="button" id="btn-toggle-mode" class="btn-link">새 모험가 등록하기</button>
        </div>
      </div>
    </section>

    <!-- 게임 홈 화면 섹션 -->
    <section id="home-section" class="home-container" style="display: none;">
      <header class="game-header">
        <h1>
